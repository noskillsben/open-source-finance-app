services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backups:/backups
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      # The Help page bundles docs/user/README.md; the image build can see it too.
      additional_contexts:
        userdocs: ./docs/user
    restart: unless-stopped
    environment:
      # Source lives on a Windows drive bind-mounted into a Linux container; inotify doesn't cross that boundary.
      CHOKIDAR_USEPOLLING: "true"
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # The user guide the Help page shows (src/Help.jsx imports ../../docs/user/README.md, which is
      # /docs/user here); read-only, and editing the file reloads the page.
      - ./docs/user:/docs/user:ro
    ports:
      - "5173:5173"

volumes:
  pgdata:
