# Production stack for the Pi 4. Run with: docker compose -f docker-compose.prod.yml up -d --build
# Secrets come from .env (see .env.example); compose refuses to start if one is missing.
# Only the web container publishes a port. No source bind mounts.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_MODE: ${APP_MODE:-single_user}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      BACKUP_DIR: /backups
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    expose:
      - "8000"

  # Nightly pg_dump at 03:00 UTC into ./backups, newest 14 kept (backend/backup-nightly.sh).
  backup:
    build: ./backend
    restart: unless-stopped
    entrypoint: ["/app/backup-nightly.sh"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      BACKUP_DIR: /backups
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      # The Help page is built from docs/user/README.md, so the guide on screen is the deployed version's.
      additional_contexts:
        userdocs: ./docs/user
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

# Explicit name so this can never be the dev checkout's <folder>_pgdata volume.
volumes:
  pgdata:
    name: finance-prod-pgdata
